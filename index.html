    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">

<body>
    <h1>2. Fetch Student Crud (firebase)</h1>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <form id="studentForm">
                            <div class="form-group">
                                <label for="contactControl">Contact</label>
                                <input class="form-control" id="contactControl" type="text">
                            </div>
                            <div class="form-group">
                                <label for="emailControl">Email</label>
                                <input class="form-control" id="emailControl" type="text">
                            </div>
                            <div class="form-group">
                                <label for="fnameControl">First Name</label>
                                <input class="form-control" id="fnameControl" type="text">
                            </div>
                            <div class="form-group">
                                <label for="lnameControl">Last Name</label>
                                <input class="form-control" id="lnameControl" type="text">
                            </div>
                            <button type="submit" class="btn btn-sm btn-block btn-primary" id="addstdbtn">Add Student</button>
                            <button type="button"class="btn btn-sm btn-block btn-danger d-none" id="updatestdbtn">Update Student</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Contact</th>
                            <th>Email</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="stdList">

                            </td>

                </table>
            </div>
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-warning" role="status">
  <span class="sr-only">Loading...</span>
</div>
